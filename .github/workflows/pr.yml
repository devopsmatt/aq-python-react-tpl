# Pull request gate for main. Security tools run from their official GitHub
# Actions at the latest release, every one pinned to a full commit SHA, and
# configured to fail on MEDIUM and above. actionlint has no official action,
# so it is built by setup-go from ci/tools/actionlint/go.mod.
# See docs/CICD.md and docs/SECURITY.md.
name: pr

on:
  pull_request:
    branches: [main]
  # Kept so organization-owned forks of this template can use a merge queue.
  merge_group:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    steps:
      - name: Check out (full history, for secret scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # With base empty and head set, the action scans the full history up to
      # the PR head, not only the PR's own commits.
      - name: TruffleHog - full git history (verified secrets)
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          version: 3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a
          extra_args: --only-verified

      - name: Gitleaks - PR commits
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Trivy filesystem - vuln, secret, misconfig (MEDIUM+, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: zizmor (MEDIUM+, SHA pins required)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          min-severity: medium
          config: .github/zizmor.yml
          advanced-security: false

      - name: Set up Go (builds actionlint)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: ci/tools/actionlint/go.sum

      - name: actionlint
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          CGO_ENABLED: "0"
        run: |
          GOBIN="$RUNNER_TEMP/bin" go -C ci/tools/actionlint install -trimpath -ldflags="-s -w" tool
          "$RUNNER_TEMP/bin/actionlint" -version | head -1
          "$RUNNER_TEMP/bin/actionlint"

      - name: ShellCheck
        run: |
          shellcheck --version | sed -n 2p
          mapfile -d '' files < <(git ls-files -z -- '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts"
            exit 0
          fi
          shellcheck "${files[@]}"

      - name: ASCII only
        run: scripts/check-ascii.sh

      # Checkov runs last because its canary files must not reach the other
      # scanners. The canary proves checks are running (docs/TERRAFORM.md 7).
      - name: Checkov - write canary
        run: scripts/checkov-gate.sh --write-canary .checkov-canary

      - name: Checkov - scan canary (must report every canary check)
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: .checkov-canary
          config_file: .checkov.yml
          soft_fail: true
          output_format: json
          output_file_path: .checkov-canary-out

      - name: Checkov - assert canary
        run: scripts/checkov-gate.sh --assert-canary .checkov-canary-out/results_json.json

      - name: Checkov - repository (Terraform, Dockerfile, GitHub Actions)
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: .
          config_file: .checkov.yml
          skip_path: .checkov-canary

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].{0,99}$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title follows Conventional Commits"
          else
            echo "::error::PR title must follow Conventional Commits, for example 'ci: add the PR security workflow'"
            exit 1
          fi
